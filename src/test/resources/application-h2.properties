# Banco em memória usado pelos testes de repositório (não precisa de MySQL instalado)
spring.datasource.url=jdbc:h2:mem:autoescola;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
api.security.token.secret=segredo-de-teste
